server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Pakai mime.types bawaan (lengkap: html, svg, css, js, dll) — JANGAN
    # override total pakai block `types {}` custom, itu akan menghapus
    # mapping utk ekstensi lain (html jadi unknown -> browser download-kan).
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # CORS header wajib untuk Module Federation: browser di origin host
    # perlu fetch remoteEntry.js & chunk-nya dari origin ini.
    location ~* \.(js|mjs|css|zip)$ {
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        add_header Access-Control-Allow-Headers "*";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
